# Copy this file to drapi-sdk-sample.properties in the same folder and fill in your values.

# Base URL of the DRAPI server. Required.
BASEURL=https://drapi.example.com:8880

# Read by the bundled PasswordTokenSource, which all samples use.
auth.username=Doctor Who
auth.password=VeryComplicatedPassword42

# Scopes to request at login. Optional. If omitted, the server default applies.
auth.scope=$DATA

# User agent sent with every request. Optional.
#USERAGENT=MyApp/1.0

# Connection timeout in seconds. Optional. Default: 5
#CONNECTTIMEOUTSECS=5

# Request timeout in seconds. Optional. Default: 15
#REQUESTTIMEOUTSECS=15
